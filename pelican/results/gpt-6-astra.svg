<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title description">
  <title id="title">California brown pelican pedaling a bicycle</title>
  <desc id="description">A California brown pelican in full breeding plumage, with a golden crown, white head and fore-neck, chestnut hindneck, red breeding throat pouch, and layered silver-gray and brown feathers. Its two webbed feet rest on opposite pedals of a teal bicycle with a diamond frame, chain, fork, and thirty-two spokes in each wheel.</desc>
  <defs>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a63234"/>
      <stop offset=".34" stop-color="#df544c"/>
      <stop offset=".66" stop-color="#c57854"/>
      <stop offset="1" stop-color="#a9a16c"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e8e2c2"/>
      <stop offset=".48" stop-color="#c4cdbb"/>
      <stop offset="1" stop-color="#8da69e"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#aab9b9"/>
      <stop offset=".55" stop-color="#7c8e92"/>
      <stop offset="1" stop-color="#45565e"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#edc759"/>
      <stop offset="1" stop-color="#f4e7b0"/>
    </linearGradient>
