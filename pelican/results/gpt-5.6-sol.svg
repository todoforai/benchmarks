    <path d="M419 389 C353 431 314 473 284 518 C337 493 389 458 445 420 Z" fill="#5a4740"/>
    <path d="M428 404 C375 454 353 496 342 534 C383 506 420 471 461 425 Z" fill="#6b554b"/>
