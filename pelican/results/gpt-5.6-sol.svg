  <path d="M568 474 C589 466 610 476 617 495 C622 509 613 523 599 533 L581 548 C559 539 548 521 551 500 Z" fill="#76594a" stroke="#332b28" stroke-width="5"/>

  <!-- Far leg to raised, rearward pedal -->
