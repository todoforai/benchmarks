    <path d="M457 470 Q493 446 522 458 Q502 493 466 495 Z"/>
    <path d="M495 466 Q530 441 558 447 Q549 479 516 493 Z"/>
  </g>
  <g fill="none" stroke="#d8d8cc" stroke-width="3" opacity=".85">
    <path d="M396 360 Q411 373 425 358"/><path d="M435 359 Q451 375 466 358"/><path d="M475 363 Q491 378 506 361"/>
    <path d="M388 394 Q404 409 421 392"/><path d="M429 397 Q446 412 463 394"/><path d="M471 400 Q489 416 506 398"/>
    <path d="M397 429 Q414 444 431 427"/><path d="M439 433 Q456 449 474 431"/>
  </g>

  <!-- White fore-neck and white head -->
  <path d="M613 154 C634 132 672 125 703 140 C731 153 742 178 730 202 C720 222 695 232 674 243 C637 263 625 290 638 326 C647 352 638 378 616 398 L580 378 C600 346 594 317 592 289 C589 248 598 205 613 154 Z"
