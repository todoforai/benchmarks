    <path d="M374 377 Q403 357 431 380 Q459 355 487 382 Q516 361 550 386"/>
    <path d="M375 410 Q405 389 434 414 Q463 389 493 418 Q522 397 557 422"/>
    <path d="M393 443 Q420 423 447 447 Q475 426 505 450 Q528 435 550 449"/>
