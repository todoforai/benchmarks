  <path d="M623 610 C637 607 648 611 659 620 L676 630 C681 636 677 645 668 646 L646 640 L626 648 L606 645 C597 638 601 626 610 620 Z" fill="#eba258" stroke="#633a27" stroke-width="5" stroke-linejoin="round"/>
  <path d="M617 624 L605 638 M635 626 L624 643 M652 631 L646 644" stroke="#925131" stroke-width="3" stroke-linecap="round"/>

  <!-- Crankset and pedals in front, visibly aligned with the pelican's feet -->
  <circle cx="575" cy="625" r="43" fill="#f3f1e7" stroke="#364144" stroke-width="7"/>
  <circle cx="575" cy="625" r="10" fill="#364144"/>
  <path d="M575 625 L622 634 M575 625 L528 592" stroke="#364144" stroke-width="8" stroke-linecap="round"/>
  <path d="M613 634 L654 634" stroke="#232b2d" stroke-width="9" stroke-linecap="round"/>
  <path d="M511 592 L542 592" stroke="#232b2d" stroke-width="9" stroke-linecap="round"/>
  <circle cx="575" cy="625" r="32" fill="none" stroke="#758083" stroke-width="3" stroke-dasharray="4 5"/>

