  <path d="M501 580 C513 577 524 580 536 588 L550 594 C555 599 551 607 544 608 L525 604 L507 612 L489 610 C481 604 484 593 492 589 Z" fill="#e19a52" stroke="#633a27" stroke-width="5" stroke-linejoin="round"/>
  <path d="M499 592 L488 603 M514 594 L504 608 M528 596 L522 607" stroke="#8c4f2f" stroke-width="3" stroke-linecap="round"/>

  <!-- Near leg stretched down and forward to the low pedal -->
