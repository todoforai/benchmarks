  <path d="M665 576 Q691 607 681 646" fill="none" stroke="#d66f3e" stroke-width="5" stroke-linecap="round"/>
  <path d="M681 646 l-10 -12 M681 646 l7 -15" fill="none" stroke="#d66f3e" stroke-width="5" stroke-linecap="round"/>
  <path d="M491 630 Q471 602 480 574" fill="none" stroke="#d66f3e" stroke-width="5" stroke-linecap="round"/>
  <path d="M480 574 l9 12 M480 574 l-7 14" fill="none" stroke="#d66f3e" stroke-width="5" stroke-linecap="round"/>

  <!-- Frame fittings -->
  <circle cx="500" cy="410" r="10" fill="#d7dedb" stroke="#334043" stroke-width="4"/>
  <circle cx="800" cy="535" r="9" fill="#d7dedb" stroke="#334043" stroke-width="4"/>
  <path d="M872 485 Q899 472 924 488" fill="none" stroke="#334043" stroke-width="8" stroke-linecap="round"/>

  <!-- Ground contact shadows -->
  <path d="M246 826 Q305 817 364 826 M836 826 Q895 817 954 826" fill="none" stroke="#596760" stroke-width="8" stroke-linecap="round" opacity=".38"/>
</svg>