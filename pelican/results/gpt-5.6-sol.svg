  <path d="M620 148 C644 119 696 116 729 142 C747 156 752 181 740 201 C724 228 680 239 644 221 C615 207 605 174 620 148 Z"
        fill="#f4f0df" stroke="#3b302c" stroke-width="5"/>

  <!-- Golden crown and blue breeding facial skin -->
  <path d="M622 153 C646 120 697 118 730 144 C739 151 746 161 749 172 C714 156 679 158 645 177 C633 181 622 174 622 153 Z" fill="#e4b83e"/>
  <path d="M695 169 C714 161 734 165 745 177 C749 184 747 194 739 202 C728 211 710 211 697 201 Z" fill="#83aeb0"/>
  <circle cx="716" cy="177" r="11" fill="#f5d34e" stroke="#332b25" stroke-width="4"/>
  <circle cx="719" cy="177" r="5" fill="#171718"/>
  <circle cx="721" cy="174" r="2" fill="#ffffff"/>

  <!-- Long bill and the characteristic large gular pouch -->
  <path d="M733 190 C812 180 922 187 1052 211 L1042 232 C934 232 833 226 732 216 C716 210 716 197 733 190 Z"
        fill="#c6a76d" stroke="#473a30" stroke-width="5" stroke-linejoin="round"/>
  <path d="M734 214 C817 225 934 234 1042 232 C1027 267 995 300 943 319 C873 345 801 340 758 307 C736 290 726 256 734 214 Z"
        fill="#b9503d" stroke="#50312c" stroke-width="6" stroke-linejoin="round"/>
  <path d="M756 226 C835 238 933 241 1019 237 C997 268 968 286 928 300 C864 323 807 315 776 292 C756 277 749 251 756 226 Z" fill="#d6794e" opacity=".72"/>
  <path d="M740 212 C826 213 931 220 1042 231" fill="none" stroke="#694f37" stroke-width="4"/>
  <path d="M1039 211 L1061 220 L1042 232 Z" fill="#7e352e" stroke="#473a30" stroke-width="4"/>
  <path d="M755 244 C788 254 820 258 851 259" fill="none" stroke="#ed9a68" stroke-width="4" stroke-linecap="round" opacity=".75"/>
  <path d="M765 272 C802 286 838 289 873 286" fill="none" stroke="#ed9a68" stroke-width="4" stroke-linecap="round" opacity=".75"/>

  <!-- Small neck feather marks -->
  <g fill="none" stroke="#c9c3b4" stroke-width="3" stroke-linecap="round">
    <path d="M615 231 q15 12 29 0"/><path d="M605 258 q15 12 29 0"/><path d="M606 286 q14 12 27 0"/>
    <path d="M612 315 q14 12 27 0"/><path d="M612 344 q13 11 25 0"/>
