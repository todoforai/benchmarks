  prompt: |
    In {REPO} I need to build a project "kill switch": stop all running todos (mine or everyone's in a project), block new starts until released, plus an auto-kill when too many todos are running concurrently. Find and report with file paths + key code:
    1. How a todo "starts" running server-side: which trpc/procedures start agent execution (todo.start? message send? resume), where todo status becomes IN_PROGRESS / running, and where scheduled (tfa-wait) wakeups, sub-agents (tfa-cli from agent shell), API-triggered todos enter execution. Is there a single chokepoint (e.g. a queue / runTodo function)?
