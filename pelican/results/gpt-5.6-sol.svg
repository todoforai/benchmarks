  <g fill="none" stroke="#a55345" stroke-width="3" stroke-linecap="round">
    <path d="M584 190 q15 11 27 -1"/><path d="M577 220 q14 11 27 -1"/><path d="M578 250 q14 11 26 -1"/>
    <path d="M584 280 q13 10 25 -1"/><path d="M591 310 q13 10 24 -1"/>
  </g>

  <!-- Forward wing reaches and curls over the handlebar -->
  <path d="M535 326 C582 304 626 314 662 338 C693 359 715 369 746 357 L766 353 C776 359 773 371 763 376 L738 382 C696 391 661 377 625 360 C599 348 576 351 552 366 Z"
