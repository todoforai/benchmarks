      <circle r="14" fill="#bac8c6" stroke="#344c53" stroke-width="4"/>
      <circle r="5" fill="#f6f1dc" stroke="#344c53" stroke-width="2"/>
      <path d="M-156-90A180 180 0 0 1-60-170" fill="none" stroke="#fffdf1" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    </g>
  </defs>

