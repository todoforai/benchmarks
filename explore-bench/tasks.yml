- id: brand-project-touchpoints
  category: exhaustive-recall
  tests: exhaustive refactor touch-point list (recall-heavy)
  source:
    todo: 2d3015c9-5f4a-4c78-afc3-10bbdefbb8bb
    subtodo: 86eb9d9a-cc53-47f6-869b-8d18ed35ad72
    date: '2026-09-22'
  baseline:
    model: anthropic:anthropic/claude-haiku-4.5
    dur_s: 196.1
    tool_calls: 36
    output_chars: 5985
  reference: refs/brand-project-touchpoints.md
  prompt: |
    In {REPO} (repos: backend, frontend, packages, cli, agent), I'm about to make "brand = project" strictly 1:1: a project owns its business context (the .md attachment) and its voice; todos inherit the project's brand; the user-level list/selection disappears. Map every touch point so I can plan. Exclude node_modules, dist, generated dirs, *.md docs, bench data.

    Report, grouped by concept, with file:line and a one-line note of what each usage does:

    A. `AppUser.businessContextIds` and `AppUser.selectedBusinessContextId` — every read/write in backend (services, routers, repositories, claim/fork/account-deletion/anonymous-merge paths), frontend (stores, hooks, components like brand picker/selector, settings), packages types, cli (`resolveBrand`, `--brand`), agent (Julia).
    B. `Todo.businessContextId` — where set (create/update/startMessage), where read (system prompt, search index `businessContextId TAG`, filters, board lanes/groups), frontend usage (todo cards, filters), shared types, agent.
    C. `Project.businessContextId` — set/read paths (ProjectService update, pinBusinessContextIfAbsent, unpinBusinessContexts, claim fork), frontend (BrandContextId.tsx / useEffectiveBrandContextId, /brand page, project settings).
    D. `BusinessContextStore` and the `businessContext` tRPC router: list/get/create/update/delete/restartSetup/setSelected — who calls each from frontend/cli/agent. Also `todoforai:business-context` resolver write path (`writeBusinessContext`, register).
    E. Onboarding flow: how the first business context gets created (analyzer todo? `useEnsureBrandContext`? `ensureContext`), how `boardMode: 'business'` relates, `Onboarding.styleAiAnswers[businessContextId]`.
