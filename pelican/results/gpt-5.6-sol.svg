  <path d="M585 330 C627 331 657 358 692 371" fill="none" stroke="#b4b5aa" stroke-width="5" stroke-linecap="round"/>
  <path d="M700 367 C722 364 742 355 759 350 Q771 349 769 360 Q756 374 736 377" fill="none" stroke="#353330" stroke-width="8" stroke-linecap="round"/>
  <path d="M711 376 C731 376 749 369 764 360 Q775 358 773 369 Q758 383 737 386" fill="none" stroke="#49423d" stroke-width="8" stroke-linecap="round"/>
  <path d="M601 342 Q618 355 635 343 M628 354 Q645 368 662 354 M655 364 Q672 378 689 365" fill="none" stroke="#c7c4b8" stroke-width="3"/>

