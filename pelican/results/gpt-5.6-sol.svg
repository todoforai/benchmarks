<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="title desc">
  <title id="title">California brown pelican riding a bicycle</title>
  <desc id="desc">A California brown pelican in breeding plumage pedals a teal diamond-frame bicycle with two fully spoked wheels.</desc>

  <defs>
    <g id="wheel">
      <circle r="166" fill="#fbfaf4" stroke="#262a2c" stroke-width="13"/>
      <circle r="156" fill="none" stroke="#a9b0b1" stroke-width="3"/>
      <g stroke="#8c9698" stroke-width="2">
        <line x1="0" y1="0" x2="156" y2="0"/>
        <line x1="0" y1="0" x2="144" y2="60"/>
        <line x1="0" y1="0" x2="110" y2="110"/>
        <line x1="0" y1="0" x2="60" y2="144"/>
        <line x1="0" y1="0" x2="0" y2="156"/>
        <line x1="0" y1="0" x2="-60" y2="144"/>
        <line x1="0" y1="0" x2="-110" y2="110"/>
        <line x1="0" y1="0" x2="-144" y2="60"/>
        <line x1="0" y1="0" x2="-156" y2="0"/>
        <line x1="0" y1="0" x2="-144" y2="-60"/>
        <line x1="0" y1="0" x2="-110" y2="-110"/>
        <line x1="0" y1="0" x2="-60" y2="-144"/>
        <line x1="0" y1="0" x2="0" y2="-156"/>
        <line x1="0" y1="0" x2="60" y2="-144"/>
        <line x1="0" y1="0" x2="110" y2="-110"/>
        <line x1="0" y1="0" x2="144" y2="-60"/>
      </g>
      <circle r="15" fill="#506064" stroke="#263033" stroke-width="5"/>
      <circle r="5" fill="#dce2df"/>
    </g>
  </defs>

  <!-- Quiet coastal backdrop -->
  <rect width="1200" height="850" fill="#f3f1e7"/>
  <path d="M0 690 C170 662 326 688 490 674 C688 657 850 681 1200 648 L1200 850 L0 850 Z" fill="#dbe5df"/>
  <path d="M0 786 C260 766 404 795 628 778 C830 763 1007 785 1200 768" fill="none" stroke="#90a8a0" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  <ellipse cx="600" cy="819" rx="480" ry="20" fill="#73827c" opacity=".18"/>

  <!-- Fully spoked wheels -->
  <use href="#wheel" transform="translate(305 660)"/>
  <use href="#wheel" transform="translate(895 660)"/>

  <!-- Rear sprocket and chain, behind the frame -->
  <circle cx="305" cy="660" r="24" fill="none" stroke="#3d4648" stroke-width="5"/>
  <path d="M306 636 L574 583 M306 684 L574 667" fill="none" stroke="#3d4648" stroke-width="5" stroke-linecap="round"/>

  <!-- Correct diamond bicycle frame: rear triangle, front triangle, head tube and fork -->
  <g fill="none" stroke="#157b79" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M305 660 L500 410 L575 625 Z"/>
    <path d="M500 410 L775 445 L800 535 L575 625 Z"/>
    <path d="M500 410 L575 625"/>
  </g>
  <g fill="none" stroke="#116260" stroke-width="9" stroke-linecap="round">
    <path d="M800 535 L895 660"/>
    <path d="M787 530 L883 665"/>
  </g>
  <path d="M500 411 L486 365" stroke="#334043" stroke-width="10" stroke-linecap="round"/>
  <path d="M448 368 Q492 353 535 370 L529 386 Q489 379 451 385 Z" fill="#3b302c" stroke="#201b19" stroke-width="4"/>

  <!-- Handlebar and brake cable -->
  <path d="M775 445 L758 373 L784 338" fill="none" stroke="#3b4649" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M737 337 L804 337 Q829 338 830 357 Q829 373 810 375" fill="none" stroke="#3b4649" stroke-width="10" stroke-linecap="round"/>
  <path d="M783 345 Q860 390 844 492" fill="none" stroke="#4e5556" stroke-width="3"/>
  <path d="M730 332 L754 343" stroke="#9a4935" stroke-width="13" stroke-linecap="round"/>
  <path d="M806 337 L829 351" stroke="#9a4935" stroke-width="13" stroke-linecap="round"/>

  <!-- Pelican tail feathers behind the body -->
  <g fill="#493832" stroke="#2f2926" stroke-width="4" stroke-linejoin="round">
