<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>California brown pelican in breeding plumage riding a bicycle</title>
  <desc>Hand-written SVG: a Pelecanus occidentalis californicus in full breeding dress (yellow crown, white head, chestnut hindneck, bright red gular pouch) pedalling a diamond-frame bicycle with spoked wheels.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE9F3"/><stop offset="1" stop-color="#FBFAF2"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B2B7B4"/><stop offset=".38" stop-color="#7C7063"/><stop offset="1" stop-color="#3F362D"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA09D"/><stop offset=".55" stop-color="#6B6154"/><stop offset="1" stop-color="#3A322A"/>
    </linearGradient>
    <radialGradient id="pouchG" cx=".35" cy=".2" r=".9">
      <stop offset="0" stop-color="#EE6A45"/><stop offset=".55" stop-color="#D2331F"/><stop offset="1" stop-color="#96170F"/>
    </radialGradient>
    <linearGradient id="billG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8CEC0"/><stop offset="1" stop-color="#9C907F"/>
    </linearGradient>

    <!-- one wheel: tyre, rim, 18 spokes, hub -->
    <g id="wheel">
      <circle r="105" fill="none" stroke="#1E2227" stroke-width="12"/>
      <circle r="96" fill="none" stroke="#C9CFD3" stroke-width="5"/>
      <g stroke="#98A2A9" stroke-width="1.8">
        <line y2="-94"/><line y2="-94" transform="rotate(20)"/><line y2="-94" transform="rotate(40)"/>
        <line y2="-94" transform="rotate(60)"/><line y2="-94" transform="rotate(80)"/><line y2="-94" transform="rotate(100)"/>
        <line y2="-94" transform="rotate(120)"/><line y2="-94" transform="rotate(140)"/><line y2="-94" transform="rotate(160)"/>
        <line y2="-94" transform="rotate(180)"/><line y2="-94" transform="rotate(200)"/><line y2="-94" transform="rotate(220)"/>
        <line y2="-94" transform="rotate(240)"/><line y2="-94" transform="rotate(260)"/><line y2="-94" transform="rotate(280)"/>
        <line y2="-94" transform="rotate(300)"/><line y2="-94" transform="rotate(320)"/><line y2="-94" transform="rotate(340)"/>
      </g>
      <circle r="9" fill="#DCE1E4" stroke="#4A5158" stroke-width="2.5"/>
    </g>

    <clipPath id="bodyClip"><ellipse cx="282" cy="205" rx="102" ry="76" transform="rotate(-8 282 205)"/></clipPath>
    <clipPath id="wingClip"><path d="M336,166 C392,172 452,196 512,238 C528,248 534,264 522,274 C486,270 430,246 384,220 C356,204 328,186 336,166 Z"/></clipPath>
    <clipPath id="headClip"><ellipse cx="496" cy="98" rx="34" ry="30" transform="rotate(-8 496 98)"/></clipPath>
  </defs>

  <!-- scene -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="112" cy="96" r="42" fill="#FFF3CE" opacity=".85"/>
  <rect y="492" width="800" height="60" fill="#BCDDE6"/>
  <rect y="552" width="800" height="48" fill="#EFE2C0"/>
  <g stroke="#FFFFFF" stroke-width="3" opacity=".6" fill="none">
    <path d="M40,516 q 18,-8 36,0"/><path d="M120,530 q 18,-8 36,0"/><path d="M660,514 q 18,-8 36,0"/><path d="M726,532 q 18,-8 36,0"/>
  </g>
  <ellipse cx="390" cy="556" rx="255" ry="14" fill="#000" opacity=".12"/>
  <g stroke="#7FA8B6" stroke-width="4" fill="none" opacity=".45" stroke-linecap="round">
    <path d="M60,380 h70"/><path d="M30,420 h55"/><path d="M52,460 h80"/>
  </g>

  <!-- ============ BICYCLE ============ -->
  <g id="bicycle">
    <use href="#wheel" x="200" y="445"/>
    <use href="#wheel" x="580" y="445"/>

    <!-- chain -->
    <g stroke="#5B6165" stroke-width="5" fill="none">
      <path d="M200,432 L378,408"/><path d="M200,458 L378,468"/>
    </g>
    <g stroke="#C3C9CC" stroke-width="1.6" stroke-dasharray="4 4" fill="none">
      <path d="M200,432 L378,408"/><path d="M200,458 L378,468"/>
    </g>
    <circle cx="200" cy="445" r="13" fill="#B9C0C4" stroke="#5B6165" stroke-width="2"/>

    <!-- diamond frame: seat tube, top tube, down tube, head tube, seat stay, chain stay -->
    <g stroke="#12626F" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M322,290 L378,438"/>
      <path d="M322,292 L500,272"/>
      <path d="M378,438 L516,318"/>
      <path d="M500,270 L517,320"/>
      <path d="M322,292 L200,445"/>
      <path d="M378,438 L200,445"/>
      <path d="M516,318 C534,356 560,410 580,445"/>
    </g>
    <g stroke="#3FA6B5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".8">
      <path d="M326,294 L378,432"/><path d="M326,288 L498,268"/><path d="M382,432 L514,314"/>
    </g>

    <!-- saddle + seatpost -->
    <path d="M322,290 L320,268" stroke="#8D969B" stroke-width="8" stroke-linecap="round"/>
    <path d="M276,268 C296,255 344,255 358,266 C346,278 296,280 276,274 Z" fill="#3B2E27"/>

    <!-- handlebar -->
    <path d="M500,270 L524,250" stroke="#8D969B" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M524,250 C548,244 562,258 556,274 C551,288 538,292 526,288" stroke="#12626F" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- bottom bracket, chainring, far crank + far pedal -->
    <path d="M378,438 L347,406" stroke="#7E878C" stroke-width="8" stroke-linecap="round"/>
    <rect x="330" y="398" width="34" height="9" rx="3" fill="#2B3136"/>
    <circle cx="378" cy="438" r="30" fill="none" stroke="#B9C0C4" stroke-width="6"/>
    <circle cx="378" cy="438" r="30" fill="none" stroke="#5B6165" stroke-width="2" stroke-dasharray="3 5"/>
    <circle cx="378" cy="438" r="10" fill="#DCE1E4" stroke="#4A5158" stroke-width="2.5"/>
  </g>

  <!-- ============ PELICAN ============ -->
  <!-- far leg (to raised far pedal) -->
  <g fill="#4A4E52" stroke="#2C3033" stroke-width="2.5" stroke-linejoin="round">
    <path d="M292,252 C300,300 306,326 318,344 L332,336 C324,314 318,286 314,250 Z"/>
    <path d="M318,344 C328,366 336,382 346,394 L358,386 C348,372 340,356 332,336 Z"/>
    <path d="M340,392 C352,388 364,392 366,400 C356,408 340,408 334,402 Z"/>
  </g>

  <!-- tail + trailing primaries (behind body) -->
  <g stroke="#241E19" stroke-width="2" stroke-linejoin="round">
    <path d="M214,238 L146,284 L156,300 L226,264 Z" fill="#4A4137"/>
    <path d="M238,230 C192,252 152,276 112,296 C154,294 208,280 250,256 Z" fill="#332C25"/>
  </g>
  <g stroke="#6E6459" stroke-width="1.5" fill="none" opacity=".9">
    <path d="M232,240 C196,258 162,278 128,294"/><path d="M240,250 C206,266 176,282 146,296"/><path d="M210,246 L154,288"/>
  </g>

  <!-- body -->
  <ellipse cx="282" cy="205" rx="102" ry="76" transform="rotate(-8 282 205)" fill="url(#bodyG)" stroke="#2F281F" stroke-width="2.5"/>
  <g clip-path="url(#bodyClip)">
    <path d="M180,240 C230,300 350,300 396,236 L396,300 L180,300 Z" fill="#3B3128" opacity=".55"/>
    <g stroke="#2E2820" stroke-width="2.4" fill="none" opacity=".55">
      <path d="M186,150 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3"/>
      <path d="M180,178 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3"/>
      <path d="M184,206 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3"/>
      <path d="M188,234 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3"/>
    </g>
    <g stroke="#D3D8D6" stroke-width="1.4" fill="none" opacity=".5">
      <path d="M190,146 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3"/>
      <path d="M184,174 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3 q14,16 28,3"/>
    </g>
  </g>

  <!-- neck (white foreneck) -->
  <path d="M372,232 C420,232 448,196 458,152 C464,124 478,108 494,102 L478,76 C450,86 428,116 418,150 C408,186 372,192 330,190 L330,222 Z" fill="#F4F0E3" stroke="#C9C2B0" stroke-width="2"/>
  <!-- chestnut breeding hindneck -->
  <path d="M478,76 C450,86 428,116 418,150 C408,186 372,192 330,190 L328,206 C382,206 420,196 432,156 C442,122 462,98 490,90 Z" fill="#5E3120"/>
  <!-- yellow patch at base of foreneck -->
  <path d="M352,208 C374,206 386,222 380,242 C362,246 346,236 344,220 Z" fill="#EDC65A" opacity=".95"/>

  <!-- head -->
  <ellipse cx="496" cy="98" rx="34" ry="30" transform="rotate(-8 496 98)" fill="#F6F2E6" stroke="#C9C2B0" stroke-width="2"/>
  <g clip-path="url(#headClip)">
    <path d="M456,96 C470,62 526,58 544,92 L544,52 L452,52 Z" fill="#F0C64B"/>
    <path d="M462,86 C476,74 500,70 520,76" stroke="#DDB53C" stroke-width="2" fill="none"/>
  </g>
  <!-- bare facial skin + pale breeding eye -->
  <ellipse cx="509" cy="88" rx="13" ry="10" fill="#2C2A33" opacity=".35"/>
  <circle cx="509" cy="88" r="6.5" fill="#EAF0F1" stroke="#3A3A3A" stroke-width="1.6"/>
  <circle cx="510" cy="88" r="2.8" fill="#161616"/>

  <!-- gular pouch (bright red, breeding) -->
  <path d="M498,112 C486,182 536,238 592,228 C640,220 672,178 690,140 L520,96 Z" fill="url(#pouchG)" stroke="#7C120C" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#8E1810" stroke-width="1.8" fill="none" opacity=".55">
    <path d="M508,136 C524,178 560,208 596,206"/>
    <path d="M508,160 C526,192 556,214 588,216"/>
    <path d="M512,186 C532,208 556,222 578,226"/>
  </g>
  <path d="M506,120 C500,160 520,196 552,214" stroke="#F49070" stroke-width="3" fill="none" opacity=".5"/>

  <!-- upper mandible -->
  <path d="M520,84 C572,90 642,110 690,130 L692,140 C642,132 566,116 518,108 Z" fill="url(#billG)" stroke="#7E7365" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M688,129 C698,132 700,142 692,148 C688,144 688,136 686,132 Z" fill="#8C8072" stroke="#6A6055" stroke-width="1.6"/>
  <path d="M528,92 C578,100 638,116 682,132" stroke="#F2ECE0" stroke-width="2" fill="none" opacity=".7"/>

  <!-- near wing reaching the handlebar -->
  <path d="M336,166 C392,172 452,196 512,238 C528,248 534,264 522,274 C486,270 430,246 384,220 C356,204 328,186 336,166 Z" fill="url(#wingG)" stroke="#2A241D" stroke-width="2.5" stroke-linejoin="round"/>
  <g clip-path="url(#wingClip)">
    <g stroke="#241F19" stroke-width="2.4" fill="none" opacity=".6">
      <path d="M330,178 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8"/>
      <path d="M330,204 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8"/>
      <path d="M330,230 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8"/>
    </g>
    <g stroke="#CFD4D1" stroke-width="1.4" fill="none" opacity=".45">
      <path d="M332,172 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8"/>
      <path d="M332,198 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8 q15,15 30,8"/>
    </g>
  </g>
  <!-- wingtip gripping the bar -->
  <path d="M508,244 C528,246 540,258 536,272 C530,284 514,284 504,274 C512,268 514,256 506,250 Z" fill="#463C32" stroke="#241F19" stroke-width="2.2"/>

  <!-- near leg + near crank pushing the down pedal -->
  <path d="M378,438 L409,470" stroke="#7E878C" stroke-width="8" stroke-linecap="round"/>
  <rect x="392" y="462" width="34" height="9" rx="3" fill="#2B3136"/>
  <g fill="#54585C" stroke="#2C3033" stroke-width="2.5" stroke-linejoin="round">
    <path d="M310,256 C318,312 330,352 348,382 L368,370 C352,342 340,304 334,254 Z"/>
    <path d="M348,382 C364,412 386,438 404,456 L420,442 C402,426 382,400 368,370 Z"/>
    <path d="M396,452 C412,444 430,448 434,458 C424,470 402,472 392,464 Z"/>
    <path d="M404,456 L432,458" fill="none"/>
  </g>
  <circle cx="348" cy="380" r="6" fill="#3B4044"/>
</svg>